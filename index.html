<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ta-daa: weet wat je in je kast hebt hangen, en krijg verrassende outfits. Alles blijft op je eigen telefoon.">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ta-daa!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ta-daa!</title>
<!--
  KAST-APP (werktitel "Wat trek ik aan")
  Bron van deze pagina: sjabloon.html. Bouwen met: python3 scripts/kast-app-bouw.py
  Het bouwscript zet de kleding (kast-data.json) op de plek van [] en [] en schrijft kast.html.

  Opbouw van het script hieronder:
    1. Gegevens en vaste lijsten        6. Profiel "Dit ben ik"
    2. Opslag (db + browser)            7. Schermen: Vandaag, Hoe voelde het, Laag voor laag
    3. Labels per kledingstuk           8. Schermen: Outfits, Nieuwe combi
    4. Regels (aan/uit) en eigen regels 9. Schermen: Kast, foto's toevoegen, labelen
    5. Ideeën van de kast + score       10. Vellen, hulpjes, navigatie
  Er wordt geen AI gebruikt: alle voorstellen komen uit de regels in deel 4 en 5.
-->
<style>
/* Rustige app: gebroken wit, inkt, één petrol-accent. De kleur komt uit de kleding. */
:root{
  /* Ta-daa! in petrol & mint: ronde vormen, een zachte gloed en sterretjes */
  --bg:#f3f7f4; --vlak:#ffffff; --foto:#eef2ef; --inkt:#1d2b2c; --mut:#667774; --lijn:#dde7e3;
  --accent:#0f5c63; --accent-zacht:#dcefe8; --op-accent:#ffffff; --pop:#cfdcd7; --tafel:#ffffff; --polaroid:#fbf8f1;
  --gloed1:rgba(95,211,180,.38); --gloed2:rgba(15,92,99,.16); --gloed3:rgba(255,179,92,.22); --ster1:#ff9f52; --ster2:#3cae8c;
  --tekst:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Donker: neutraal grafiet met hetzelfde petrol-accent als licht, zodat de kleding de rest van de kleur geeft. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1b1d; --vlak:#172a2c; --foto:#e6e3de; --inkt:#eef5f2; --mut:#9db5b0; --lijn:#24393b;
  --accent:#5fd3b4; --accent-zacht:#1a3a37; --op-accent:#0b2326; --pop:#2a4245; --tafel:#172a2c; --polaroid:#f6f2ea;
  --gloed1:rgba(95,211,180,.42); --gloed2:rgba(15,92,99,.6); --gloed3:rgba(255,179,92,.22); --ster1:#ffb35c; --ster2:#fff1c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b1d; --vlak:#172a2c; --foto:#e6e3de; --inkt:#eef5f2; --mut:#9db5b0; --lijn:#24393b;
  --accent:#5fd3b4; --accent-zacht:#1a3a37; --op-accent:#0b2326; --pop:#2a4245; --tafel:#172a2c; --polaroid:#f6f2ea;
  --gloed1:rgba(95,211,180,.42); --gloed2:rgba(15,92,99,.6); --gloed3:rgba(255,179,92,.22); --ster1:#ffb35c; --ster2:#fff1c9; color-scheme:dark}

/* basis */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}   /* twee keer snel tikken = twee tikken, niet inzoomen */
button,a,input,select{touch-action:manipulation}
html,body{height:100%}
body{background:var(--bg);color:var(--inkt);font:16px/1.45 var(--tekst);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;transition:transform .08s ease,opacity .08s ease}
button:active{transform:scale(.97);opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
#app{max-width:520px;margin:0 auto;padding-block:14px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;line-height:1.2;margin:0 0 12px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:19px;margin:0 0 8px;font-weight:700}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
.boven{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:2px}
.mut{color:var(--mut);font-size:14px;margin:0}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.kop h1{margin:0}

/* knoppen en keuzes */
.primair{display:block;width:100%;background:var(--accent);color:var(--op-accent);font-weight:700;border-radius:99px;padding:15px;text-align:center}
.primair:disabled{opacity:.45}
.primair.gedaan{background:var(--accent-zacht);color:var(--inkt)}
.secundair{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--vlak);border:1.5px solid var(--lijn);font-weight:700;border-radius:16px;padding:12px 16px}
.link{color:var(--mut);text-decoration:underline;font-size:14px;padding:10px;display:block;margin:0 auto}
.toevoeg{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--op-accent);font-weight:700;font-size:14px;border-radius:99px;padding:9px 14px 9px 11px;flex:none}
.toevoeg .ico{width:20px;height:20px}
.weer-seg{margin:0 0 10px}
.plusrond{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--op-accent);display:grid;place-items:center;flex:none}
.pillen{display:flex;flex-wrap:wrap;gap:6px}
.pil{border:1.5px solid var(--lijn);background:var(--vlak);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:700;min-height:38px}
.pil[aria-pressed="true"]{background:var(--inkt);border-color:var(--inkt);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.filters .pil{flex:none}
.tel{color:var(--mut);font-size:12px;font-weight:600}
.pil[aria-pressed="true"] .tel{color:inherit;opacity:.7}
.seg{display:flex;background:var(--lijn);border-radius:14px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--vlak);color:var(--inkt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg b{background:var(--accent);color:var(--op-accent);border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--vlak);border-radius:14px;padding:11px 12px;font-weight:600;font-size:14.5px;text-align:left;gap:10px;width:100%}
.toggle i{width:34px;height:20px;border-radius:10px;background:var(--lijn);position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--vlak);transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{left:17px}
button.toggle i,button.regel i{background:transparent;box-shadow:inset 0 0 0 2px var(--inkt)}
button.toggle i::after,button.regel i::after{background:var(--inkt)}
button.toggle[aria-pressed="true"] i,button.regel[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
button.toggle[aria-pressed="true"] i::after,button.regel[aria-pressed="true"] i::after{background:#fff}

/* Vandaag */
.voorstel{background:var(--vlak);border-radius:24px;padding:10px;margin-bottom:12px;width:100%;text-align:left}
.midden{text-align:center}
.logo{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--accent);margin:18px 0 6px}
.stappen{list-style:none;counter-reset:stap;padding:0;margin:18px 0}
.stappen li{counter-increment:stap;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;background:var(--vlak);border-radius:16px;padding:12px;margin-bottom:8px}
.wat{font-size:17px;margin:6px 0 8px}
.app-icoon{width:84px;height:84px;border-radius:20px;margin:16px auto 10px;display:block;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.welkom-kop{color:var(--accent);font-size:26px}
.instellen{padding-top:8px}
.keuzelijst{display:grid;gap:8px;margin:16px 0}
.keuzelijst .secundair{justify-content:flex-start;flex-direction:column;align-items:flex-start;text-align:left;border-radius:20px;padding:14px 16px;font-size:16px}
.keuzelijst .secundair small{font-weight:400;color:var(--mut);font-size:13px}
.keuzelijst .secundair[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-zacht)}
.instellen-nav{margin-top:18px}
.gate{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.gate-stap{display:flex;gap:12px;align-items:center;background:var(--vlak);border-radius:20px;padding:10px 14px;font-size:15.5px}
.gate-nr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--op-accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.gate-ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent-zacht);color:var(--accent);display:grid;place-items:center;overflow:hidden}
.gate-ic img{width:100%;height:100%}
#tour{position:fixed;inset:0;z-index:40}
.tour-gat{position:fixed;box-shadow:0 0 0 9999px rgba(5,12,13,.72);pointer-events:none;transition:all .2s ease}
.tour-pijl{position:fixed;inset:0;pointer-events:none;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tour-wolk{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--vlak);border-radius:24px;padding:18px 18px 14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.6)}
.tour-wolk h3{font-size:18px;margin:2px 0 4px}.tour-wolk p{margin:0 0 6px}
.tour-label{font-size:12px;font-weight:600;color:var(--mut);margin:0}
.tour-kop{display:flex;justify-content:space-between;align-items:center}.tour-kop .link{margin:0;font-size:13px;padding:4px 0}
.tour-nav .secundair{width:auto;padding:11px 18px}
#tour button:focus{outline:none}#tour button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tour-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.tour-nav .primair{width:auto;padding:11px 18px}.tour-nav .link{margin:0}
@media (prefers-reduced-motion:reduce){.tour-gat{transition:none}}
.stappen li::before{content:counter(stap);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--op-accent);display:grid;place-items:center;font-weight:700}
.stappen span{color:var(--mut);font-size:14px}
.kort{margin:0;padding-left:20px;font-size:15px}.kort li{margin-bottom:8px}
.primair.gevaar{background:#a33a2c;color:#fff}
.wissels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.wisselknop{background:var(--vlak);border:1.5px solid var(--lijn);border-radius:22px;padding:8px 10px;display:flex;flex-direction:column;align-items:center}
.wisselknop small{font-size:11.5px;color:var(--mut);font-weight:600}
.wisselknop b{font-size:17px}
.tafel{position:relative;display:block;width:100%;height:min(48vh,410px);border-radius:28px;background:var(--tafel);margin-bottom:12px;overflow:hidden;isolation:isolate}
.tafel::before{content:"";position:absolute;inset:-20%;z-index:-1;filter:blur(12px);
  background:radial-gradient(circle at 28% 28%,var(--gloed1),transparent 46%),radial-gradient(circle at 76% 46%,var(--gloed2),transparent 46%),radial-gradient(circle at 45% 82%,var(--gloed3),transparent 46%)}
.ster{position:absolute;z-index:9;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.ster{animation:twinkel 2.6s ease-in-out infinite}.ster:nth-of-type(2n){animation-delay:-1.3s}
  @keyframes twinkel{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.55}}}
.pol{position:absolute;width:44%;background:var(--polaroid);padding:6px 6px 16px;border-radius:3px;box-shadow:0 10px 18px -10px rgba(0,0,0,.55)}
.pol img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--foto)}
.pol i{position:absolute;left:8px;bottom:4px;font-style:normal;font-size:11px;font-weight:700;color:#59646a}
.mini-pol{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--tafel);border-radius:14px}
.mini-pol span{background:var(--polaroid);padding:3px 3px 9px;border-radius:2px;box-shadow:0 4px 8px -5px rgba(0,0,0,.5)}
.mini-pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.lagen-foto{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px}
.lagen-foto img{width:100%;aspect-ratio:3/4.1;object-fit:contain;background:var(--foto);border-radius:14px;display:block}
.voorstel .onder{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 6px 2px;font-size:13.5px;color:var(--inkt);opacity:.75}
.knoppen{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:16px}
.secundair.rond{width:52px;height:52px;padding:0;border-radius:50%}.secundair.rond .ico{width:24px;height:24px}
.politie{background:var(--accent-zacht);border-radius:16px;padding:10px 14px;margin:-4px 0 12px;font-size:14.5px}
.politie b{display:block;font-size:12px;color:var(--mut);font-weight:700}
.kastcheck{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--accent-zacht);border-radius:18px;padding:12px;margin-bottom:12px}
.kastcheck img{width:72px;height:88px;object-fit:contain}
.kastcheck p{margin:2px 0 0}
.check-knoppen{grid-column:1/-1;display:grid;gap:6px}
#check-weer{grid-column:1/-1}
nav button{position:relative}
nav button.stip::before{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.vandaag-keuze{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.weerknop{flex:none;font-size:13px;font-weight:700;color:var(--accent);border:1.5px solid var(--lijn);border-radius:99px;padding:7px 11px;background:var(--vlak)}
.gevoel{display:grid;gap:8px;margin-top:14px}
.gevoel button[aria-pressed="true"]{background:var(--accent);color:var(--op-accent);border-color:var(--accent)}
.etiket{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-zacht);border-radius:99px;padding:1px 8px}

/* Outfits */
.outfit-raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kaart{background:var(--vlak);border-radius:18px;padding:6px;text-align:left;width:100%}
.kaart .lagen-foto{gap:4px}.kaart .lagen-foto img{border-radius:11px}
.kaart .lagen-foto img:nth-child(n+5){display:none}
.kaart .onder{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 2px;font-size:12px;color:var(--inkt);opacity:.75;min-height:24px}
.leeg-staat{background:var(--vlak);border-radius:18px;padding:18px;color:var(--mut);text-align:center;grid-column:1/-1}

/* Laag voor laag en Nieuwe combi */
.terug{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;margin-bottom:6px;padding:6px 0}
.slots{display:grid;gap:8px;margin:10px 0 14px}
.slot{display:flex;align-items:center;background:var(--vlak);border-radius:18px;width:100%}
.slot-hoofd{flex:1;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:7px 4px 7px 7px;text-align:left;min-width:0}
.slot-weg{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);margin-right:4px;border-radius:50%}
.slot.leeg{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:7px;text-align:left}
.slot img{width:60px;height:72px;object-fit:cover;background:var(--foto);border-radius:2px;border:3px solid var(--polaroid);box-shadow:0 3px 6px -4px rgba(0,0,0,.4)}
.slot .wat{font-size:11.5px;font-weight:700;color:var(--mut)}
.slot b{display:block;font-size:15px;line-height:1.2}
.slot small{color:var(--mut);font-size:12.5px}
.slot.accent{box-shadow:inset 3px 0 0 var(--accent)}
.slot.leeg{background:transparent;border:1.5px dashed var(--lijn)}
.slot .plek{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.wissel{color:var(--mut);padding:8px}
.notitie,.historie{background:var(--vlak);border-radius:16px;padding:12px 14px;font-size:14.5px;margin-bottom:10px}
.notitie p{margin:0}.notitie p+p{margin-top:4px}
.historie{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.historie button{font-weight:700;color:var(--accent);text-decoration:underline;white-space:nowrap}
.tip{background:var(--accent-zacht);border-radius:16px;padding:11px 14px;font-size:14.5px;margin-bottom:10px}
.tip b{display:block;font-size:13px}
.bevestig{background:var(--vlak);border-radius:16px;padding:12px;margin-top:8px}
.bevestig p{margin:0 0 8px;font-weight:700}
.bevestig div{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Hoe voelde het */
.voelde{background:var(--vlak);border-radius:24px;padding:16px;margin-bottom:16px}
.schaal{margin:16px 0 4px}
.schaal .ends{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--accent);height:28px}

/* Kast en labelen */
.raster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.raster:has(.stuk){gap:5px}
.stuk{position:relative;padding:0;border-radius:14px;overflow:hidden;background:var(--foto)}
.stuk img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.stuk .stip{position:absolute;left:7px;bottom:7px;width:15px;height:15px;border-radius:50%;background:var(--k);box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.4)}
.stuk span{display:block;font-size:12px;line-height:1.2;margin:5px 2px 2px;min-height:2.4em}
.stuk small{display:block;font-size:11px;color:var(--mut);margin:0 2px 2px;min-height:1.3em}
.groot{width:100%;max-height:38vh;object-fit:contain;background:var(--foto);border-radius:18px;display:block;margin-bottom:12px}
.voortgang{height:4px;background:var(--lijn);border-radius:4px;margin:4px 0 12px}
.voortgang i{display:block;height:100%;background:var(--accent);border-radius:4px}
.groep{margin-bottom:16px}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.swatch{aspect-ratio:1;border-radius:50%;background:var(--k);border:1px solid rgba(0,0,0,.12);display:grid;place-items:center;min-height:36px}
.swatch[aria-pressed="true"]{outline:3px solid var(--inkt);outline-offset:2px}
.swatch b{background:var(--vlak);color:var(--inkt);border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.breek{flex-basis:100%;height:0}
.vastonder{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 0;margin-top:8px}

/* Dit ben ik */
.blok{background:var(--vlak);border-radius:18px;padding:14px;margin-bottom:12px}
.blok h2{font-size:16px;margin:0 0 4px}
.blok .mut{margin-bottom:10px}
.pop{position:relative;width:220px;height:330px;margin:4px auto 6px}
.pop svg{width:220px;height:330px;display:block}
.pop svg path,.pop svg circle{fill:var(--pop)}
.zone{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;font-weight:700;border-radius:99px;padding:5px 10px;white-space:nowrap;border:1.5px solid transparent}
.zone[data-stand="ja"]{background:var(--accent);color:var(--op-accent)}
.zone[data-stand="mm"]{background:var(--vlak);color:var(--inkt);border-color:var(--lijn)}
.zone[data-stand="nee"]{background:var(--bg);color:var(--mut);border:1.5px dashed var(--mut)}
.legenda{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);justify-content:center}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{width:12px;height:12px;border-radius:50%}
.regel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--lijn);font-size:14.5px;width:100%;text-align:left}
.regel:last-child{border:0}
.regel small{display:block;color:var(--mut);font-size:12.5px}
.regel i{width:34px;height:20px;border-radius:10px;background:var(--lijn);position:relative;flex:none}
.regel i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--vlak);transition:left .15s}
.regel[aria-pressed="true"] i{background:var(--accent)}
.regel[aria-pressed="true"] i::after{left:17px}
.nooit{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:8px 0}
select{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--lijn);border-radius:12px;padding:10px;background:var(--vlak);color:var(--inkt)}
.eigen{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--lijn);font-size:14.5px}
.eigen button{color:var(--mut);text-decoration:underline;font-size:13px}

/* vel van onder, melding, onderbalk */
.vel-achter{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:20}
.vel{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.greep{width:42px;height:5px;border-radius:9px;background:var(--lijn);margin:4px auto 10px}
.vel-kop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sluit{width:40px;height:40px;border-radius:50%;background:var(--vlak);display:grid;place-items:center}
.kies-rij{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.kies-rij button{flex:none;width:92px;text-align:left}
.kies-rij img{width:92px;height:112px;object-fit:cover;background:var(--foto);border-radius:12px;display:block;border:2px solid transparent}
.kies-rij button[aria-pressed="true"] img{border-color:var(--accent)}
.kies-rij span{font-size:11.5px;display:block;line-height:1.2;margin-top:3px}
.melding{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inkt);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;max-width:90vw}
.melding button{font-weight:700;text-decoration:underline;margin-left:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--vlak);border-top:1px solid var(--lijn);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11.5px;font-weight:700;color:var(--mut);border-radius:12px}
nav button[aria-current="page"]{color:var(--inkt);background:var(--accent-zacht)}
nav button[aria-current="page"] .ico{stroke-width:2.3}
nav button[aria-current="page"]::after{content:"";display:block;width:18px;height:3px;border-radius:3px;background:var(--inkt);margin-top:2px}
@media (prefers-reduced-motion:no-preference){.vel{animation:op .22s ease-out}@keyframes op{from{transform:translateY(30px);opacity:.7}}}

<script>window.TADAA_SITE=true;</script>
<script>
"use strict";
/* ================= 1. Gegevens en vaste lijsten ================= */
const KAST=[];          // kleding uit kast-data.json (vul je aan via de app: zie deel 9)
const OUTFITS=[];    // outfits die Irene samen met Claude heeft gemaakt
const KAST_BASIS=[...KAST];
const K=Object.fromEntries(KAST.map(k=>[k.id,k]));   // snel opzoeken op id

const BEHOEFTES=[["comfy","Comfortabel"],["sexy","Sexy"],["stoer","Stoer"]];   // warm zit in het weer
const LAAG={vest:"Bovenlaag",kimono:"Bovenlaag","jasje/blazer":"Bovenlaag",blouse:"Top","shirt/top":"Top",trui:"Top",jurk:"Basis",jumpsuit:"Basis",hemdje:"Accent",broek:"Onder",rok:"Onder",schoenen:"Schoenen"};
const VOLGORDE=["Bovenlaag","Basis","Top","Accent","Onder","Schoenen"];
const SOORTEN=[["vest","Vest"],["kimono","Kimono"],["blouse","Blouse"],["shirt/top","Shirt of top"],["trui","Trui"],["hemdje","Hemdje"],["broek","Broek"],["rok","Rok"],["jurk","Jurk"],["jumpsuit","Jumpsuit"],["schoenen","Schoenen"]];
const SOORTNAAM=Object.fromEntries(SOORTEN.map(([k,t])=>[k,t.toLowerCase()]));
const PALET=[["zwart","#1b1b1b"],["wit","#f5f5f2"],["grijs","#8a8f93"],["taupe","#8a7a70"],["bruin","#5a3e2e"],["ecru","#ece3cc"],["geel","#f0c230"],["limoen","#c9d82a"],["oranje","#e57a32"],["rood","#c62a2f"],["bordeaux","#6e1a2a"],["lichtroze","#f2c4cf"],["roze","#ef7f9a"],["fuchsia","#d1197a"],["lila","#b59ad8"],["paars","#5b2bb0"],["aubergine","#4a1f3d"],["lichtblauw","#a9c6e4"],["blauw","#2f6fd6"],["kobalt","#1f45c9"],["donkerblauw","#1f2a4a"],["denim","#5b7aa0"],["turquoise","#1fb3b0"],["petrol","#0f5c63"],["smaragd","#0e8a63"],["zeegroen","#4f9a86"],["salie","#a3b49d"],["olijf","#6b6a2e"],["donkergroen","#2f4a3a"]];
const FEL=new Set(["fuchsia","kobalt","blauw","turquoise","smaragd","rood","roze","paars","lila","limoen","geel","oranje","zeegroen","bordeaux"]);
const STRAK_FEL=new Set(["fuchsia","kobalt","turquoise","smaragd","limoen","rood","oranje","paars","geel"]);
const ZACHT=new Set(["salie","zeegroen","lichtblauw","lila","ecru","lichtroze"]);
const BLAUW=new Set(["kobalt","blauw","donkerblauw","lichtblauw"]);
const FAMILIE={rood:"rood",bordeaux:"rood",oranje:"rood",roest:"rood",fuchsia:"roze",roze:"roze",lichtroze:"roze",paars:"paars",lila:"paars",aubergine:"paars",
  kobalt:"blauw",blauw:"blauw",donkerblauw:"blauw",lichtblauw:"blauw",turquoise:"turquoise",
  smaragd:"groen",zeegroen:"groen",salie:"groen",olijf:"groen",donkergroen:"groen",petrol:"groen",limoen:"geel",geel:"geel",ecru:"geel",
  denim:"denim",zwart:"zwart"}; // wit, grijs, blauwgrijs, taupe en bruin tellen niet als kleur
const KLEURTYPES={winter:["Winter","koel, helder, veel contrast",["ecru","olijf","roest","oranje","taupe"]],zomer:["Zomer","koel en zacht",["zwart","oranje","limoen"]],
  lente:["Lente","warm en helder",["zwart","aubergine","bordeaux"]],herfst:["Herfst","warm en gedempt",["fuchsia","kobalt","lichtblauw"]],onbekend:["Weet ik niet","de kast kijkt alleen naar je regels",[]]};
const WEER=[["koud","Koud"],["fris","Fris"],["warm","Warm"]];
const DRAGEN=[["los","Los"],["onder","Onder iets"],["over","Over iets"],["knopen","Knopen"],["instoppen","Instoppen"]];
const ICO_EXTRA={camera:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',lagen:'<svg class="ico" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>'};
const ICO={wissel:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',terug:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'};

/* ================= 2. Opslag ================= */
/* Alles wat je in de app doet, staat in één document (kast/staat) in de db van deze pagina.
   Zo is het hetzelfde op telefoon en laptop, en kan Claude het teruglezen. De browser is reserve. */
const IRENE_NOOIT=[ // Irenes eigen voorkeuren (waren eerst algemene regels)
  {a:"k:kobalt",b:["k:blauw","k:donkerblauw","k:lichtblauw"]},{a:"k:blauw",b:["k:donkerblauw","k:lichtblauw"]},{a:"k:donkerblauw",b:["k:lichtblauw"]},
  {a:"k:fuchsia",b:["k:rood","k:roze","k:blauw","k:lichtblauw","k:donkerblauw"]},{a:"k:kobalt",b:["k:rood","k:bordeaux"]},
  {a:"s:4548",b:["k:salie","k:zeegroen","k:lichtblauw","k:lila","k:ecru"]},
  {a:"s:4586",b:["s:4583","s:4584","s:4530","s:4546","s:4519","s:4520"]},{a:"s:4603",b:["s:4583","s:4584","s:4530","s:4546","s:4519","s:4520"]},{a:"s:4606",b:["s:4583","s:4584","s:4530","s:4546","s:4519","s:4520"]}];
/* Ta-daa bestaat in twee vormen:
   - SITE (de website voor iedereen): alles blijft op de telefoon, in de browser (localStorage + IndexedDB voor foto's).
   - Irenes eigen versie op claude.ai: bewaart in de db van die pagina, met haar kleding erin. */
const SITE=!!window.TADAA_SITE;
const PROFIEL_START=SITE
  ?{afdeling:"allebei",kleurtype:"onbekend",zones:{},comfort:{geenHakken:false},regelsUit:["fel"],nooit:[],genegeerd:[]}
  :{afdeling:"dames",kleurtype:"winter",zones:{schouders:"ja",armen:"nee"},comfort:{geenHakken:true},regelsUit:[],nooit:[],genegeerd:[]};
const LEEG={labels:{},extra:[],weg:[],status:{},gedragen:[],wegStuk:[],wegIdee:[],nieuw:[],profiel:PROFIEL_START};
const kopie=x=>JSON.parse(JSON.stringify(x));
let S=kopie(LEEG);
const LS=SITE?"tadaa-staat":"kast-app-v2";
try{const l=JSON.parse(localStorage.getItem(LS)||"null"); if(l) S={...S,...l};}catch(e){}
let dbDoc=null, schrijfTimer=null;
function bewaar(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(!dbDoc) return;
  clearTimeout(schrijfTimer);
  schrijfTimer=setTimeout(()=>{dbDoc.set(kopie(S)).catch(()=>{});},500);
}
/* ---------- foto's: op de telefoon (IndexedDB) of in de opslag van claude.ai ---------- */
const FOTO_URL={};   // "idb:sleutel" → tijdelijke adres van de foto op dit apparaat
function fotoDb(){return new Promise((ok,nee)=>{const r=indexedDB.open("tadaa-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos");r.onsuccess=()=>ok(r.result);r.onerror=()=>nee(r.error);});}
async function idb(modus,fn){const db=await fotoDb();return new Promise((ok,nee)=>{const t=db.transaction("fotos",modus);const r=fn(t.objectStore("fotos"));t.oncomplete=()=>ok(r?.result);t.onerror=()=>nee(t.error);});}
async function laadFotos(){ if(!SITE) return; try{
  const sleutels=await idb("readonly",s=>s.getAllKeys());
  for(const k of sleutels){const b=await idb("readonly",s=>s.get(k)); if(b) FOTO_URL["idb:"+k]=URL.createObjectURL(b);}
}catch(e){} }
async function bewaarFoto(blob,type){
  if(SITE){const k=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await idb("readwrite",s=>s.put(blob,k));FOTO_URL["idb:"+k]=URL.createObjectURL(blob);return "idb:"+k;}
  const assets=await window.claude?.use?.("assets"); if(!assets) throw new Error("geen opslag");
  return (await assets.upload(blob,{type})).id;
}
const fotoSrc=a=>!a?"":a.startsWith("idb:")?(FOTO_URL[a]||""):"/_blob/"+a;
function zonderAutomatisch(){ // stukken die nog gelabeld moeten worden: originele foto en geen geraden kleur
  let anders=false;
  for(const n of S.nieuw||[]){
    if(n.klaar) continue;
    if(n.uitgeknipt&&n.origineel&&n.asset!==n.origineel){n.asset=n.origineel;anders=true;}
    if(n.kleurAuto&&n.kleuren.length===1&&n.kleuren[0]===n.kleurAuto){n.kleuren=[];anders=true;}
    if(n.kleurAuto){n.kleurAuto=null;anders=true;}
  }
  if(anders) bewaar();
}
async function opstarten(){ // eerst de foto's van de telefoon laden, dan pas tekenen
  await laadFotos(); zonderAutomatisch(); syncNieuw(); toon();
  if(SITE) navigator.storage?.persist?.().catch(()=>{});   // vraag de browser de gegevens niet zomaar op te ruimen
}
(async()=>{
  if(SITE) return;
  try{
    const db=await window.claude?.use?.("db"); if(!db) return;
    dbDoc=db.doc("kast/staat");
    const snap=await dbDoc.get();
    // Let op: data uit de opslag is 'bevroren'. Daarom eerst kopiëren, anders werken knoppen niet meer.
    if(snap.exists){ S={...kopie(LEEG),...kopie(snap.data())}; if(S.profiel&&!S.profiel.overgezet){S.profiel.nooit=[...IRENE_NOOIT,...(S.profiel.nooit||[])];S.profiel.overgezet=true;} try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} syncNieuw(); toon(false); }
    else bewaar();
  }catch(e){ dbDoc=null; }
})();
const P=()=>({...PROFIEL_START,genegeerd:[],...S.profiel,comfort:{...PROFIEL_START.comfort,...(S.profiel?.comfort||{})},zones:{...(S.profiel?.zones||{})}});
const heren=()=>P().afdeling==="heren";

/* ================= 3. Labels per kledingstuk ================= */
function labels(id){
  const it=K[id], l=S.labels[id]||{};
  const dragen=l.dragen??it.dragen??(it.soort==="hemdje"?["onder"]:[]);
  return {tags:l.tags??it.tags??[], hak:l.hak??!!it.hak, dragen, accent:l.accent??(it.soort==="hemdje"||dragen.includes("onder")), zichtbaar:l.zichtbaar??it.zichtbaar??[], weer:l.weer??it.weer??["koud","fris","warm"]};
}
const tags=id=>labels(id).tags;
const kleur=id=>K[id]?.kleuren?.[0];
const isPatroon=id=>!!K[id]?.patroon;
// een stuk kan meer soorten zijn (vest én jurk): soort = meestal, ook = de rest
const soortenVan=k=>k?[k.soort,...(k.ook||[])].filter(Boolean):[];
const isSoort=(k,l)=>soortenVan(k).some(s=>l.includes(s));
const lagenVan=k=>soortenVan(k).map(s=>LAAG[s]);
const metPanty=id=>isSoort(K[id],["rok","jurk"]);
// welke rol speelt een stuk in deze outfit? (vest-jurk naast een jurk = vest, naast een vest = jurk)
function rolVan(id,ids){
  const l=[...new Set(lagenVan(K[id]))]; if(l.length<2) return l[0]||LAAG[K[id]?.soort];
  const ander=new Set((ids||[]).filter(x=>x!==id&&K[x]).map(x=>LAAG[K[x].soort]));
  const ok=l.filter(r=>!ander.has(r)&&!(r==="Basis"&&(ander.has("Top")||ander.has("Onder")))&&!((r==="Top"||r==="Onder")&&ander.has("Basis")));
  return ok[0]||l[0];
}
const actief=id=>K[id]&&!S.wegStuk.includes(id);
// kast als kleurwaaier: licht → warm → koel → groen → aardetinten → donker
const WAAIER=["wit","ecru","geel","limoen","oranje","rood","lichtroze","roze","fuchsia","bordeaux","aubergine","lila","paars","lichtblauw","blauw","kobalt","denim","donkerblauw","turquoise","petrol","zeegroen","smaragd","salie","olijf","donkergroen","taupe","bruin","grijs","zwart"];
const opKleur=l=>[...l].sort((a,b)=>{const i=k=>{const x=WAAIER.indexOf(k.kleuren?.[0]);return x<0?99:x;};return i(a)-i(b)||(a.soort>b.soort?1:a.soort<b.soort?-1:0);});
const kastNu=()=>KAST.filter(k=>actief(k.id)&&past(k));
function past(k){ // wat hoort bij je afdeling (herenkleding: geen rokken, jurken of hakken)
  if(!heren()) return true;
  return !["rok","jurk"].includes(k.soort)&&!(k.soort==="schoenen"&&labels(k.id).hak);
}
function zones(){ // de plekken op het poppetje, met woorden die bij je afdeling passen
  return [["schouders","Schouders"],["armen","Armen"],["decollete",heren()?"Borst":"Decolleté"],["rug","Rug"],["taille","Taille"],["heupen","Heupen"],["benen","Benen"]];
}

/* ================= 4. Regels ================= */
/* Elke regel kun je aan of uit zetten bij "Dit ben ik". 'verbod' houdt een combi tegen,
   'voorkeur' zet hem alleen hoger of lager. ctx = {ids, its, kl (hoofdkleuren), fam (kleurfamilies)}. */
const REGELS=[ // algemene regels: voor iedereen
  {id:"max3",groep:"Kleur",tekst:"Maximaal 3 kleuren",verbod:c=>new Set(c.fam).size>3},
  {id:"eentonig",groep:"Kleur",tekst:"Niet alles uit één kleurfamilie",verbod:c=>new Set(c.fam).size===1&&c.fam.length>=2},
  {id:"fel",groep:"Kleur",tekst:"Minstens één felle kleur",verbod:c=>![...c.kl].some(k=>FEL.has(k))},
  {id:"patroon",groep:"Combineren",tekst:"Niet twee patronen",verbod:c=>c.ids.filter(isPatroon).length>1},
  {id:"vesttrui",groep:"Combineren",tekst:"Geen vest over een trui",verbod:c=>c.its.some(i=>i.soort==="trui")&&c.its.some(i=>rolVan(i.id,c.ids)==="Bovenlaag")},
  {id:"wijd",groep:"Combineren",tekst:"Niet wijd met wijd",verbod:c=>c.its.some(i=>rolVan(i.id,c.ids)==="Bovenlaag"&&i.pasvorm==="wijd")&&c.its.some(i=>["broek","rok"].includes(i.soort)&&i.pasvorm==="wijd")},
  {id:"weer",groep:"Combineren",tekst:"Past bij het weer van vandaag",verbod:c=>!c.its.every(pastWeer)},
  {id:"blikvanger",groep:"Voorkeur",tekst:"Eén blikvanger per outfit",voorkeur:c=>c.its.some(i=>i.patroon)&&c.its.some(i=>!i.patroon&&!["hemdje","schoenen"].includes(i.soort)&&STRAK_FEL.has(i.kleuren?.[0]))?-1:0},
  {id:"herhaal",groep:"Voorkeur",tekst:"Een kleur die terugkomt",voorkeur:c=>{const a=c.its.flatMap(i=>i.kleuren||[]);return a.some((k,i)=>k!=="zwart"&&a.indexOf(k)!==i)?1:0;}},
];
const TYPEREGELS={ // komen er vanzelf bij als je je kleurtype kiest
  winter:[
    {id:"felzacht",groep:"Kleurtype",tekst:"Fel niet naast zacht",verbod:c=>[...c.kl].some(k=>STRAK_FEL.has(k))&&[...c.kl].some(k=>ZACHT.has(k))},
    {id:"gezicht",groep:"Kleurtype",tekst:"De felste kleur bij je gezicht",voorkeur:c=>{const f=i=>FEL.has(i.kleuren?.[0]);const b=c.its.filter(i=>["Top","Bovenlaag","Basis"].includes(LAAG[i.soort])),o=c.its.filter(i=>LAAG[i.soort]==="Onder");return (b.some(f)?.5:0)-(o.some(f)&&!b.some(f)?1:0);}},
  ],
  zomer:[{id:"zachtcontrast",groep:"Kleurtype",tekst:"Zachte kleuren, weinig contrast",voorkeur:c=>[...c.kl].filter(k=>STRAK_FEL.has(k)).length>1?-1:0}],
  lente:[{id:"helderwarm",groep:"Kleurtype",tekst:"Heldere, warme kleuren",voorkeur:c=>c.kl.has("zwart")?-.5:0}],
  herfst:[{id:"gedempt",groep:"Kleurtype",tekst:"Gedempte, warme kleuren",voorkeur:c=>[...c.kl].filter(k=>STRAK_FEL.has(k)).length>1?-1:0}],
  onbekend:[],
};
const alleRegels=()=>[...REGELS,...(TYPEREGELS[P().kleurtype]||[])];
const regelAan=id=>!P().regelsUit.includes(id);
function context(ids){
  const its=ids.map(id=>K[id]), kleding=its.filter(i=>i.soort!=="schoenen");
  return {ids,its,kl:new Set(kleding.map(i=>i.kleuren?.[0]).filter(Boolean)),fam:kleding.map(i=>FAMILIE[i.kleuren?.[0]]).filter(Boolean)};
}
function nooitSamen(ids){ // eigen regels: "nooit A met B" (A is een kleur of kledingstuk, B één of meer)
  const heeft=w=>w.startsWith("k:")?ids.some(id=>(K[id].kleuren||[]).slice(0,1).includes(w.slice(2))):ids.includes(w.slice(2));
  return P().nooit.some(r=>heeft(r.a)&&[].concat(r.b).some(heeft));
}
function regelsOk(ids){
  const c=context(ids);
  if(alleRegels().some(r=>r.verbod&&regelAan(r.id)&&r.verbod(c))) return false;
  return !nooitSamen(ids);
}
function voorkeur(ids){
  const c=context(ids); let s=0;
  for(const r of alleRegels()) if(r.voorkeur&&regelAan(r.id)) s+=r.voorkeur(c);
  const minder=KLEURTYPES[P().kleurtype]?.[2]||[];          // kleurtype: deze kleuren staan je minder
  s-=0.4*c.its.filter(i=>minder.includes(i.kleuren?.[0])).length;
  s+=zichtScore(ids);
  return s;
}
function zichtScore(ids){ // wat laat deze outfit zien, en hoe voel jij je daarbij?
  const its=ids.map(id=>K[id]); const bedekt=new Set();
  if(ids.some(id=>rolVan(id,ids)==="Bovenlaag")) ["schouders","armen","rug"].forEach(z=>bedekt.add(z));
  const zicht=new Set(its.filter(i=>i.soort!=="hemdje").flatMap(i=>labels(i.id).zichtbaar).filter(z=>!bedekt.has(z)));
  let s=0; const z=P().zones;
  zicht.forEach(x=>{ if(z[x]==="ja") s+=.4; if(z[x]==="nee") s-=1.2; });
  return Math.max(-3,Math.min(1,s));
}

function suggesties(){ // kleurparen die je minstens 3 keer weghaalde en nooit bewaarde
  const paren=ids=>{const k=[...new Set(ids.filter(id=>K[id]&&K[id].soort!=="schoenen").map(kleur).filter(c=>c&&FAMILIE[c]))].sort();const p=[];k.forEach((a,i)=>k.slice(i+1).forEach(b=>p.push(a+"+"+b)));return p;};
  const weg={}; S.wegIdee.forEach(s=>paren(s.split("+")).forEach(p=>weg[p]=(weg[p]||0)+1));
  const bewaard=new Set(OUTFITS.concat(S.extra).flatMap(o=>paren(o.stukken)));
  const al=new Set(P().nooit.flatMap(r=>[].concat(r.b).map(b=>[r.a,b].map(x=>x.slice(2)).sort().join("+"))));
  return Object.entries(weg).filter(([p,n])=>n>=3&&!bewaard.has(p)&&!al.has(p)&&!P().genegeerd.includes(p)).sort((a,b)=>b[1]-a[1]).map(([p,n])=>({paar:p.split("+"),n}));
}

/* ================= 5. Ideeën van de kast + score ================= */
function schoenVoor(ids){
  const schoenen=kastNu().filter(k=>k.soort==="schoenen"), its=ids.map(id=>K[id]);
  const kies=f=>schoenen.find(f)?.id||null;
  if(its.some(i=>labels(i.id).hak)) return kies(s=>labels(s.id).hak&&pastWeer(s));
  if(its.some(i=>metPanty(i.id))) return kies(s=>!labels(s.id).hak&&pastWeer(s)&&tags(s.id).includes("stoer"))||kies(s=>!labels(s.id).hak&&pastWeer(s));
  return kies(s=>!labels(s.id).hak&&pastWeer(s)&&tags(s.id).includes("comfy")&&!tags(s.id).includes("stoer"))||kies(s=>!labels(s.id).hak&&pastWeer(s));
}
let _ideeCache=null,_ideeSleutel="";
function ideeen(vast){
  const sleutel=JSON.stringify([S.wegStuk,S.wegIdee,S.labels,S.profiel,vast.length,KAST.length,weerNu()]);
  if(_ideeCache&&_ideeSleutel===sleutel) return _ideeCache;
  const al=new Set(vast.map(o=>kledingIn(o).sort().join("+")));
  const kast=kastNu().filter(k=>!k.nietInIdeeen), soort=s=>kast.filter(k=>isSoort(k,s));
  const tops=soort(["blouse","shirt/top","trui"]), onders=soort(["broek","rok"]), vesten=soort(["vest","kimono"]), hemdjes=soort(["hemdje"]), basis=soort(["jurk","jumpsuit"]);
  const kandidaten=[];
  const probeer=(ids,bonus)=>{
    if(new Set(ids).size<ids.length||!regelsOk(ids)) return; // hetzelfde stuk niet twee keer
    const k=[...ids].sort().join("+"); if(al.has(k)||S.wegIdee.includes(k)) return; al.add(k);
    const fel=new Set(ids.map(kleur).filter(c=>FEL.has(c))).size;
    const sch=schoenVoor(ids);
    kandidaten.push({nr:"i"+k,sleutel:k,stukken:sch?[...ids,sch]:ids,status:"idee",idee:true,
      schoenen:ids.some(metPanty)?"Met panty":"",s:fel+bonus+voorkeur(ids)+dagzaad(k)*0.8});
  };
  for(const t of tops) for(const o of onders){
    const wilAccent=t.soort==="blouse"||t.scheveHals||labels(t.id).dragen.includes("over");
    const accenten=wilAccent?hemdjes.filter(h=>kleur(h.id)!==kleur(t.id)).sort((a,b)=>FEL.has(kleur(b.id))-FEL.has(kleur(a.id))).slice(0,3):[null];
    for(const h of accenten){
      const ids=h?[t.id,o.id,h.id]:[t.id,o.id];
      probeer(ids,h?0.4:0);
      if(!t.geenVestErover) for(const v of vesten) probeer([...ids,v.id],0.6);
    }
  }
  for(const b of basis) for(const v of vesten) probeer([b.id,v.id],0.5);
  // variatie: elk stuk komt maar een paar keer voor, lastige stukken één keer
  const telling={}, uit=[], vrij=(k,max)=>(telling[k]||0)<max;
  for(const c of kandidaten.sort((a,b)=>b.s-a.s)){
    const ids=kledingIn(c), hoofd=ids[0];
    const onder=ids.find(id=>["broek","rok"].includes(K[id].soort))||"-", vest=ids.find(id=>rolVan(id,ids)==="Bovenlaag")||"-", acc=ids.find(id=>K[id].soort==="hemdje")||"-";
    const sleutels=[hoofd,"o"+onder,"v"+vest,"a"+acc,...ids.filter(id=>K[id].lastig).map(id=>"l"+id)];
    const max=k=>k.startsWith("l")?1:k==="v-"||k==="a-"?99:k.startsWith("o")||k.startsWith("v")||k.startsWith("a")?4:2;
    if(!sleutels.every(k=>vrij(k,max(k)))) continue;
    sleutels.forEach(k=>telling[k]=(telling[k]||0)+1);
    uit.push(c); if(uit.length>=24) break;
  }
  _ideeCache=uit; _ideeSleutel=sleutel; return uit;
}
const kledingIn=o=>o.stukken.filter(id=>K[id]?.soort!=="schoenen");
function alle(){ // alle outfits: vaste + eigen combi's + ideeën van de kast
  const eigen=OUTFITS.map(o=>({...o,nr:String(o.nr),status:S.status[o.nr]||o.status})).concat(S.extra.map(o=>({...o,nr:String(o.nr)})));
  const heeftBasis=o=>o.stukken.some(id=>isSoort(K[id],["broek","rok","jurk","jumpsuit"]));
  const vast=eigen.filter(o=>!S.weg.map(String).includes(o.nr)).map(o=>({...o,stukken:o.stukken.filter(id=>actief(id)&&past(K[id]))})).filter(o=>kledingIn(o).length>=2&&heeftBasis(o));
  return vast.concat(ideeen(vast));
}
const vind=nr=>alle().find(o=>o.nr===String(nr));
function weerNu(){ // je eigen keuze voor vandaag, anders een gok op basis van de maand
  if(S.weerVandaag?.datum===vandaagDatum()) return S.weerVandaag.weer;
  const m=new Date().getMonth(); return [10,11,0,1].includes(m)?"koud":[4,5,6,7,8].includes(m)?"warm":"fris";
}
const pastWeer=i=>!i||labels(i.id).weer.includes(weerNu());
const inSeizoen=o=>!regelAan("weer")||o.stukken.every(id=>pastWeer(K[id]));
let behoefte={};
function score(o){ // hoe goed past een outfit bij vandaag?
  let s=0;
  for(const [n] of BEHOEFTES){ if(!behoefte[n]) continue;
    let c=o.stukken.filter(id=>tags(id).includes(n)).length;
    s+=c>0?Math.min(c,2):-0.7;
  }
  const g=S.gedragen.filter(x=>String(x.nr)===o.nr&&x.klaar).slice(-1)[0];
  if(g){ s+=(g.mij-50)/25;
    if(behoefte.comfy&&g.zit<35) s-=1.5;   // knelde
    if(g.warm<35&&weerNu()!=="warm") s-=1;   // was te koud
    if(g.warm>75&&weerNu()!=="koud") s-=.5;  // was te warm
    if(g.pas==="wijd") s-=.7;                // zat te wijd
  }
  if(favoriet(o)) s+=.6;
  if(o.idee) s-=.6; else s+=zichtScore(kledingIn(o));
  const dagen=d=>(new Date(vandaagDatum())-new Date(d))/864e5;
  const gedragen=S.gedragen.filter(x=>String(x.nr)===o.nr).map(x=>dagen(x.datum)).filter(d=>d<7);
  if(gedragen.length) s-=1.5;                                   // net gedragen: even niet
  const overgeslagen=(GEZIEN[o.nr]||[]).filter(d=>dagen(d)<3).length;
  s-=Math.min(2,overgeslagen*.7);                               // net overgeslagen: even niet
  return s;
}
function dagzaad(x){const n=[...String(x)].reduce((a,c)=>a+c.charCodeAt(0),0);const d=new Date();const v=(d.getFullYear()*372+d.getMonth()*31+d.getDate())*97+n*131;return ((v*9301+49297)%233280)/233280;}
const ranglijst=()=>alle().filter(inSeizoen).map(o=>({o,s:score(o)+dagzaad(o.nr)*1.2})).sort((a,b)=>b.s-a.s).map(x=>x.o);
// welke outfits je net hebt overgeslagen (alleen op dit apparaat, zodat de lijst elke dag wisselt)
let GEZIEN={}; try{GEZIEN=JSON.parse(localStorage.getItem("kast-gezien")||"{}");}catch(e){}
function overgeslagen(nr){(GEZIEN[nr]??=[]).push(vandaagDatum());GEZIEN[nr]=GEZIEN[nr].slice(-5);try{localStorage.setItem("kast-gezien",JSON.stringify(GEZIEN));}catch(e){}}
function favoriet(o){const g=S.gedragen.filter(x=>String(x.nr)===o.nr&&x.klaar).slice(-1)[0];return !!g&&g.mij>=70;}

const POLAROID_PLEK={1:[[50,50,-2]],2:[[31,44,-5],[69,56,4]],3:[[28,30,-6],[72,34,5],[50,72,-2]],4:[[28,27,-6],[72,29,5],[29,73,4],[71,73,-3]],5:[[26,25,-6],[74,27,5],[50,50,2],[26,76,4],[74,76,-4]]};

function slotKnop(id,_,ids){ // één laag: tik om te wisselen, kruisje om weg te halen

function tips(ids){ // de kast legt uit wat jouw regels van een combi vinden
  const its=ids.map(id=>K[id]).filter(Boolean), c=context(ids), t=[];
  if(regelAan("max3")&&new Set(c.fam).size>3) t.push(`Dit zijn ${new Set(c.fam).size} kleuren. Jouw regel: maximaal 3.`);
  if(its.some(i=>i.scheveHals)&&!its.some(i=>i.soort==="hemdje")) t.push("Scheve hals: kies een gekleurd hemdje eronder, dan piept het bandje eruit.");
  if(regelAan("vesttrui")&&REGELS.find(r=>r.id==="vesttrui").verbod(c)) t.push("Een vest over een trui wordt snel te warm en te dik. Kies een top eronder.");
  if(regelAan("wijd")&&REGELS.find(r=>r.id==="wijd").verbod(c)) t.push("Wijd met wijd: kies één van de twee getailleerd.");
  if(its.some(i=>i.soort!=="schoenen"&&labels(i.id).hak)&&its.some(i=>i.soort==="schoenen"&&!labels(i.id).hak)) t.push("Dit stuk draag je alleen met hakken.");

}

function laatstGedragen(id){ // datum waarop dit stuk voor het laatst in een gedragen outfit zat

function kastCheck(){ // stukken die je al een maand niet droeg, en die je niet net hebt beantwoord

async function verwerk(file){ // foto verkleinen en de hoofdkleur eruit halen (rekenen, geen AI)

function knipUit(x,w,h){

  for(let yy=0;yy<h;yy+=4){tel(px(yy*w*4));tel(px((yy*w+w-1)*4));}

  const DEEL=ic('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>');
  const PLUS=ic('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>');
  const PUNTEN=ic('<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>');
  const APP='<img src="icon-192.png" alt="">';
  const stap=(n,icoon,tekst)=>`<li class="gate-stap"><span class="gate-nr">${n}</span><span class="gate-ic">${icoon}</span><span>${tekst}</span></li>`;
  if(isAndroid()) return `<ol class="gate">${stap(1,PUNTEN,"Tik rechtsboven op <b>⋮</b>.")}${stap(2,PLUS,"Kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.")}${stap(3,APP,"Open Ta-daa! vanaf je startscherm.")}</ol>`;
  return `<ol class="gate">${stap(1,DEEL,"Tik op <b>Deel</b>. Zie je die knop niet? Tik dan eerst op <b>···</b>.")}${stap(2,PLUS,"Kies <b>Zet op beginscherm</b>.")}${stap(3,APP,"Open Ta-daa! vanaf je beginscherm.")}</ol>`;
}
function beginscherm(){
  app.innerHTML=`<div class="midden"><img class="app-icoon" src="icon-192.png" alt=""><h1 class="welkom-kop">Hoi, welkom bij Ta-daa!</h1>
    <p class="wat">Weet wat je in je kast hebt hangen, en krijg verrassende outfits. Alles blijft op je telefoon.</p>
    <p class="mut">Zet Ta-daa eerst op je beginscherm. Dan werkt hij als een echte app en blijft je kast bewaard.</p></div>
  ${beginschermStappen()}
  <button class="link" id="browser">Liever in de browser gebruiken</button>`;
  $("#browser").onclick=()=>{try{localStorage.setItem("tadaa-browser","1");}catch(e){} toon();};

}
const TOUR=[ // volgt de menubalk: eerst je kast vullen, dan de rest
  {tab:"kast",doel:"#plus",kop:"Voeg je kleding toe",tekst:"Maak een foto van één kledingstuk, het liefst op een effen ondergrond. Of maak screenshots van je online aankopen."},
  {tab:"kast",doel:'nav [data-tab="kast"]',kop:"Na het toevoegen komt je kleding hier",tekst:"Blader door je kast en vertel per stuk wat het is. Hoe meer je invult, hoe beter Ta‑daa voor je werkt."},
  {tab:"vandaag",doel:'nav [data-tab="vandaag"]',kop:"Laat je verrassen",tekst:"Kies hier het weer en waar je zin in hebt. Ta‑daa stelt dan een outfit voor."},
  {tab:"outfits",doel:'nav [data-tab="outfits"]',kop:"Optioneel: vertel hoe het voelde",tekst:"Na het dragen vraagt Ta‑daa hoe je outfit voelde. Zo leert de app wat bij je past. Al je outfits staan hier."},
  {tab:"ik",doel:'nav [data-tab="ik"]',kop:"Hier pas je alles aan",tekst:"Je antwoorden van daarnet, je kleurtype en je eigen regels. Ook je back-up vind je hier."}];
let TS=-1;
function startTour(){ TS=0; tekenTour(); }
function tourVolgende(klaar){
  if(klaar||TS>=TOUR.length-1){ TS=-1; S.welkom=true; bewaar(); $("#tour").hidden=true; $("#tour").innerHTML=""; tab="kast"; kast.w="kast"; toon(); melding("Veel plezier met Ta-daa!"); return; }
  TS++; tekenTour();
}
function tekenTour(){
  const st=TOUR[TS]; tab=st.tab; if(st.tab==="kast") kast.w="kast"; toon();
  const el=document.querySelector(st.doel), box=$("#tour"); if(!el){ tourVolgende(); return; }
  const r=el.getBoundingClientRect(), pad=6, H=innerHeight, W=innerWidth, laatste=TS===TOUR.length-1;
  const rond=parseFloat(getComputedStyle(el).borderRadius)||14;
  box.hidden=false;
  box.innerHTML=`<div class="tour-gat" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+2*pad}px;height:${r.height+2*pad}px;border-radius:${rond+pad}px"></div>
    <svg class="tour-pijl" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"></svg>
    <div class="tour-wolk" role="dialog" aria-modal="true" aria-label="${esc(st.kop)}">
      <div class="tour-kop"><p class="tour-label">Uitleg ${TS+1} van ${TOUR.length}</p>${laatste?"":'<button class="link" id="tour-over">Overslaan</button>'}</div><h3>${esc(st.kop)}</h3><p>${esc(st.tekst)}</p>
      <div class="tour-nav">${TS?'<button class="secundair" id="tour-terug">Vorige</button>':"<span></span>"}<button class="primair" id="tour-verder">${laatste?"Aan de slag!":"Volgende"}</button></div></div>`;
  // wolkje onder het doel als het past, anders erboven; ertussen ruimte voor de pijl
  const w=box.querySelector(".tour-wolk"), h=w.offsetHeight, gat=40, boven=r.top-pad, onder=r.bottom+pad;
  const kant=onder+gat+h<=H-12?"onder":"boven";
  w.style.top=(kant==="onder"?onder+gat:Math.max(12,boven-gat-h))+"px";
  const wr=w.getBoundingClientRect(), cx=Math.min(Math.max(r.left+r.width/2,28),W-28);
  const sy=kant==="onder"?wr.top-6:wr.bottom+6, ey=kant==="onder"?onder+6:boven-6, k=9, r1=kant==="onder"?-1:1;
  box.querySelector(".tour-pijl").innerHTML=`<path d="M${cx},${sy} L${cx},${ey}"/><path d="M${cx-k},${ey-r1*k} L${cx},${ey} L${cx+k},${ey-r1*k}"/>`;
  $("#tour-verder").onclick=()=>tourVolgende(laatste);
  if($("#tour-over")) $("#tour-over").onclick=()=>tourVolgende(true);
  if($("#tour-terug")) $("#tour-terug").onclick=()=>{TS--;tekenTour();};
}
addEventListener("resize",()=>{if(TS>=0) tekenTour();});
const STAPPEN=[
  ["Voeg je kleding toe","Eén stuk per foto, liefst op een effen laken of tegen een muur. Meer foto's tegelijk mag."],
  ["Vertel per stuk wat het is","Wat het is, de kleur, voor welk weer en hoe het voelt."],
  ["Vertel wie je bent","Bij Dit ben ik kies je wat je graag laat zien en welke regels je wilt."],
  ["Laat je verrassen","Tik op het weer en waar je zin in hebt, Ta‑daa stelt een outfit voor."],
  ["Vertel hoe het voelde","Eén tik na het dragen is genoeg. Zo leert Ta-daa wat bij jou past."]];
const stappenHtml=()=>`<ol class="stappen genummerd">${STAPPEN.map(([t,u])=>`<li><b>${t}</b><span>${u}</span></li>`).join("")}</ol>`;
const VRAGEN=["kleding","zien","kleurtype"];
function instellen(i=0){
  const p=P(), vragen=VRAGEN, v=vragen[i], laatste=i===vragen.length-1;
  const mag=z=>p.zones[z]||"mm";
  const inhoud={
    kleding:`<h1>Welke kleding draag je?</h1><p class="mut">Zo weet Ta‑daa welke soorten kleding en welke woorden bij jou passen.</p>
      <div class="keuzelijst">${[["dames","Dameskleding"],["heren","Herenkleding"],["allebei","Allebei"]].map(([k,t])=>`<button class="secundair" data-afd="${k}" aria-pressed="${p.afdeling===k}">${t}</button>`).join("")}</div>`,
    zien:`<h1>Wat laat je graag zien?</h1><p class="mut">Tik een plek om te wisselen. Er is geen goed of fout: het gaat erom waar jij je fijn in voelt.</p>
      <div class="pop">${POP}${zones().map(([z,t])=>`<button class="zone" data-zone="${z}" data-stand="${mag(z)}" style="left:${ZONEPLEK[z][0]}px;top:${ZONEPLEK[z][1]}px">${t}</button>`).join("")}</div>
      <div class="legenda"><span><i style="background:var(--accent)"></i>laat ik graag zien</span><span><i style="background:var(--vlak);border:1.5px solid var(--lijn)"></i>maakt niet uit</span><span><i style="border:1.5px dashed var(--mut)"></i>liever bedekt</span></div>`,
    kleurtype:`<h1>Weet je je kleurtype?</h1><p class="mut">Dan kiest Ta-daa kleuren die je goed staan. Weet je het niet? Geen probleem.</p>
      <div class="keuzelijst">${Object.entries(KLEURTYPES).map(([k,w])=>`<button class="secundair" data-kt="${k}" aria-pressed="${p.kleurtype===k}">${w[0]}${k!=="onbekend"?`<small>${w[1]}</small>`:""}</button>`).join("")}</div>`};
  app.innerHTML=`<div class="instellen"><p class="tour-label">Vraag ${i+1} van ${vragen.length}</p>${inhoud[v]}
    <div class="tour-nav instellen-nav">${i?'<button class="link" id="vorige">Vorige</button>':'<button class="link" id="slaover">Sla over</button>'}<button class="primair" id="verder">${laatste?"Klaar":"Volgende"}</button></div>
    <p class="mut" style="text-align:center;margin-top:10px;font-size:13px">Je kunt dit later altijd aanpassen bij Dit ben ik.</p></div>`;
  const zet=f=>{S.profiel=p;f(p);bewaar();_ideeCache=null;instellen(i);};
  app.querySelectorAll("[data-afd]").forEach(b=>b.onclick=()=>zet(p=>p.afdeling=b.dataset.afd));
  app.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>zet(p=>{const z=b.dataset.zone;p.zones[z]=STANDEN[(STANDEN.indexOf(mag(z))+1)%3];}));
  app.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>zet(p=>p.kleurtype=b.dataset.kt));
  const klaar=()=>{S.profiel=p;S.ingesteld=true;bewaar();toon();};
  $("#verder").onclick=()=>laatste?klaar():instellen(i+1);
  if($("#vorige")) $("#vorige").onclick=()=>instellen(i-1);
  if($("#slaover")) $("#slaover").onclick=klaar;
  scrollTo(0,0);
}
function welkom(){ setTimeout(startTour,50); app.innerHTML=""; }
function uitleg(onderwerp,van="ik"){
  const terug=`<button class="terug" id="terug">${ICO.terug}Dit ben ik</button>`;
  const T={
    werkt:`<h1>Hoe werkt Ta-daa?</h1>${WAT_IS_TADAA}${stappenHtml()}<p class="mut">Ta-daa gebruikt geen AI. Alle voorstellen komen uit regels en uit wat jij zelf aangeeft.</p>`,
    scherm:`<h1>Zet Ta-daa op je beginscherm</h1>
      <div class="blok"><h2>iPhone (Safari)</h2><ol class="kort"><li>Tik onderin op het deel-icoon: het vierkantje met de pijl omhoog.</li><li>Kies <b>Zet op beginscherm</b>.</li><li>Tik op <b>Voeg toe</b>.</li></ol></div>
      <div class="blok"><h2>Android (Chrome)</h2><ol class="kort"><li>Tik rechtsboven op de drie puntjes.</li><li>Kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.</li><li>Bevestig.</li></ol></div>
      <p class="mut">Waarom? Dan werkt Ta-daa als een echte app. En zonder beginscherm kan je telefoon de gegevens van een website na een tijdje opruimen, vooral op een iPhone. Op je beginscherm blijft je kast bewaard.</p>`,
    privacy:`<h1>Privacy</h1><div class="blok"><ul class="kort">
      <li><b>Alles blijft op jouw telefoon:</b> je foto's, je kleding, je outfits en wat je invult. Er gaat niks naar een server, ook niet naar Denkstroom.</li>
      <li><b>Geen account, geen wachtwoord.</b> Niemand anders kan je kast zien.</li>
      <li><b>Geen AI, geen reclame, geen volgers.</b> Ta-daa telt niet mee wie wat doet.</li>
      <li><b>Foto's zonder locatie.</b> Ta-daa verkleint je foto's en bewaart ze zonder de plek waar ze gemaakt zijn.</li>
      <li><b>Let op wat er op je foto staat,</b> zoals je gezicht in de spiegel of je huis.</li>
      <li><b>De website zelf</b> staat bij GitHub. Zoals bij elke website kan GitHub zien dat de pagina wordt geopend, maar niet wat je in Ta-daa doet.</li>
      <li><b>Nieuwe telefoon?</b> Maak eerst een back-up, anders ben je je kast kwijt.</li>
      <li><b>Alles wissen?</b> Gebruik "Verwijder al mijn gegevens". Verwijder je Ta-daa of je browsergegevens, dan is alles ook weg.</li></ul></div>`,
    backup:`<h1>Back-up</h1><div class="blok"><h2>Back-up maken</h2><p class="mut">Je krijgt één bestand met je hele kast, inclusief foto's. Kies daarna <b>Bewaar in Bestanden</b>, bijvoorbeeld in iCloud Drive. Dan heb je hem ook op een nieuwe telefoon.</p><button class="primair" id="maak">Maak een back-up</button></div>
      <div class="blok"><h2>Back-up terugzetten</h2><p class="mut">Dit vervangt wat nu in Ta-daa staat door de kast uit het bestand.</p><input type="file" id="terugbestand" accept=".json,application/json" hidden><button class="secundair" id="kies" style="width:100%">Kies een back-upbestand</button></div>`,
    wissen:`<h1>Verwijder al mijn gegevens</h1><div class="blok"><p>Hiermee wis je alles: je foto's, je kleding, je outfits en wat je bij Dit ben ik hebt ingevuld. Dit kan niet ongedaan worden. Wil je je kast bewaren? Maak dan eerst een back-up.</p>
      <div class="bevestig" style="background:var(--bg)"><p>Weet je het zeker?</p><div><button class="secundair" id="nee">Nee, bewaar alles</button><button class="primair gevaar" id="ja">Ja, wis alles</button></div></div></div>`};
  app.innerHTML=terug+T[onderwerp];
  $("#terug").onclick=()=>{tab="ik";toon();};
  if(onderwerp==="backup"){ $("#maak").onclick=maakBackup; $("#kies").onclick=()=>$("#terugbestand").click(); $("#terugbestand").onchange=e=>zetTerug(e.target.files[0]); }
  if(onderwerp==="wissen"){ $("#nee").onclick=()=>{tab="ik";toon();}; $("#ja").onclick=wisAlles; }
  scrollTo(0,0);
}
const naarDataUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});
async function maakBackup(){
  melding("Back-up maken…");
  const fotos={}; for(const a of Object.keys(FOTO_URL)){const b=await idb("readonly",s=>s.get(a.slice(4))); if(b) fotos[a]=await naarDataUrl(b);}
  const bestand=new Blob([JSON.stringify({app:"ta-daa",versie:1,datum:vandaagDatum(),staat:S,fotos})],{type:"application/json"});
  const naam=`ta-daa-backup-${vandaagDatum()}.json`, f=new File([bestand],naam,{type:"application/json"});
  try{ if(navigator.canShare?.({files:[f]})){ await navigator.share({files:[f],title:naam}); melding("Back-up gemaakt. Bewaar het bestand goed."); return; } }
  catch(e){ if(e&&e.name==="AbortError"){ melding("Back-up niet bewaard"); return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=naam;
  document.body.appendChild(a); a.click(); a.remove(); melding("Back-up gemaakt. Bewaar het bestand goed.");
}
async function zetTerug(bestand){
  if(!bestand) return;
  try{
    const d=JSON.parse(await bestand.text()); if(d.app!=="ta-daa"||!d.staat) throw 0;
    await idb("readwrite",s=>s.clear());
    for(const [a,url] of Object.entries(d.fotos||{})){const b=await (await fetch(url)).blob(); await idb("readwrite",s=>s.put(b,a.slice(4)));}
    S={...kopie(LEEG),...d.staat,welkom:true}; bewaar(); location.reload();
  }catch(e){ melding("Dit bestand is geen Ta-daa-back-up."); }
}
async function wisAlles(){
  try{localStorage.removeItem(LS);localStorage.removeItem("kast-gezien");}catch(e){}
  try{(await fotoDb()).close();}catch(e){}
  await new Promise(ok=>{const r=indexedDB.deleteDatabase("tadaa-fotos");r.onsuccess=r.onerror=r.onblocked=()=>ok();});
  location.reload();
}

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const foto=id=>K[id]?`<img src="${K[id].foto}" alt="${esc(K[id].naam)}" loading="lazy">`:"";
const groet=()=>{const u=new Date().getHours();return (u<12?"Goeiemorgen":u<18?"Goeiemiddag":"Goeienavond")+" leukerd!";};
function labelTekst(ids){const s=new Set(ids.flatMap(tags));return BEHOEFTES.filter(b=>s.has(b[0])).map(b=>b[1].toLowerCase()).join(" · ");}
const gesorteerd=ids=>[...ids].sort((a,b)=>VOLGORDE.indexOf(rolVan(a,ids))-VOLGORDE.indexOf(rolVan(b,ids)));
function melding(t,ongedaan){ // korte melding onderin, eventueel met 'Ongedaan maken'
  const m=$("#melding"); m.innerHTML=esc(t)+(ongedaan?'<button id="ongedaan">Ongedaan maken</button>':"");
  m.hidden=false; clearTimeout(m._t); m._t=setTimeout(()=>m.hidden=true,ongedaan?5000:2400);
  if(ongedaan) $("#ongedaan").onclick=()=>{ongedaan();bewaar();_ideeCache=null;m.hidden=true;toon(false);};
}
function vel(html){$("#vel-plek").innerHTML=`<div class="vel-achter" id="achter"></div><div class="vel" role="dialog" aria-modal="true"><div class="greep"></div>${html}</div>`;document.body.style.overflow="hidden";$("#achter").onclick=sluit;const s=$("#vel-plek .sluit");if(s)s.onclick=sluit;}
function sluit(){$("#vel-plek").innerHTML="";document.body.style.overflow="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")sluit();});
function opties(laag){ // kledingstukken die op deze laag passen ("TopBasis" = top of jurk)
  const lagen=laag==="TopBasis"?["Top","Basis"]:[laag];
  return kastNu().filter(k=>lagenVan(k).some(l=>lagen.includes(l))&&pastWeer(k));
}
function wisselVel(id,rol,klaar){
  const laag=rol||LAAG[K[id].soort];
  vel(`<div class="vel-kop"><h2>Wissel ${laag.toLowerCase()}</h2><button class="sluit" aria-label="Sluiten">${ICO.x}</button></div>
  <div class="kies-rij">${opties(laag).map(k=>`<button data-k="${k.id}" aria-pressed="${k.id===id}"><img src="${k.foto}" alt=""><span>${esc(k.naam)}</span></button>`).join("")}</div>
  `);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sluit();klaar(b.dataset.k);});
}
function kiesVel(laag,klaar){
  const naam=laag==="TopBasis"?"top of jurk":laag.toLowerCase();
  vel(`<div class="vel-kop"><h2>Kies ${naam}</h2><button class="sluit" aria-label="Sluiten">${ICO.x}</button></div>
  <div class="kies-rij">${opties(laag).map(k=>`<button data-k="${k.id}"><img src="${k.foto}" alt=""><span>${esc(k.naam)}</span></button>`).join("")}</div>`);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sluit();klaar(b.dataset.k);});
}
function bewaarVel(stukken,schoenen,na){ // combi bewaren: geen extra vragen
  S.extra.push({nr:nieuwNr(),stukken:[...stukken],schoenen:schoenen||"",tip:"",eigen:true});
  bewaar();na&&na();melding("Bewaard bij je outfits");tab="outfits";outfits.f="mijn";toon();
}
let tab="vandaag";
const SCHERMEN={vandaag,outfits,kast,ik};
const markeerMenu=()=>{document.querySelectorAll("nav [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const k=document.querySelector('nav [data-tab="kast"]'); k.classList.toggle("stip",kastCheck().length>0||teLabelen().length>0);};
function toon(scroll=true){ markeerMenu(); SCHERMEN[tab](); document.querySelector("nav").hidden=moetEerstBeginscherm()||(SITE&&!S.ingesteld&&!S.welkom&&TS<0&&tab==="vandaag"); if(scroll) scrollTo(0,0); }
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>{werk=null;tab=b.dataset.tab;toon();});
opstarten();
